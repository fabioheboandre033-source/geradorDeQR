<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Um cartão de perfil responsivo criado com HTML e CSS.">
    <meta name="keywords" content="perfil, cartão, responsivo, HTML, CSS"> 
    <meta name="author" content="Fábio André">
    <title>Gerador de Qr</title>
    <link rel="stylesheet" href="Css/estilo.css">
</head>
<body>
    <div class="container">
        <h1> Criador de código QR</h1>
        <div class="input-grupo">
            <input type="text" id="inputtexto" class="area-de-testo"   placeholder="enter text or URL">
            <button id="qr-generate" class="gerar-QR">Gerar QR</button>
        </div>
        <p id="erro" class="paragrafo"></p>
        <div id="qr-code" class="separada"></div>
        <button id="baixar-qr" class="dowlond">Baixar QR</button>
        
    </div>
    <script src="JS/outro.js"></script>
</body>
</html>
